name: SAILOO
description: "SAILOO Marketerz."
publish_to: 'none'
version: 0.1.0+2

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.1
  webview_flutter_android: ^4.3.0
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.0
  path_provider: ^2.1.2
  http: ^1.2.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png